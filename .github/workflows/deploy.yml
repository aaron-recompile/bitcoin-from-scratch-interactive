name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Site path relative to the domain root. Set to '' once a custom domain is attached.
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci
          pip install jupyter-server ipykernel ecdsa

      # Readers run the code in Pyodide, so test it there, not just in CPython.
      - name: Every chapter runs in browser Python
        run: npm run test:browser-python

      - name: Build site (executes every notebook; any error fails the build)
        run: npx myst build --html --execute --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
